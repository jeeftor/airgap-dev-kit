# The bundled tmux terminfo database supports this portable terminal type.
term xterm-256color
# Airgap terminal preset: select text, release to copy, middle-click to paste.
font_family JetBrainsMono Nerd Font
font_size 12

# Application selections (tmux/OpenCode OSC 52) write CLIPBOARD. Use that same
# destination for native selections so middle-click never reads stale PRIMARY.
copy_on_select clipboard
mouse_map middle press grabbed,ungrabbed discard_event
mouse_map middle release grabbed,ungrabbed paste_from_clipboard

# Keep keyboard clipboard shortcuts available alongside the mouse workflow.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Airgap default: Monokai. Change it with airgap theme set <name>.
background #272822
foreground #f8f8f2
cursor #f8f8f2
cursor_text_color #272822
selection_background #49483e
selection_foreground #f8f8f2
color0 #272822
color1 #f92672
color2 #a6e22e
color3 #f4bf75
color4 #66d9ef
color5 #ae81ff
color6 #a1efe4
color7 #f8f8f2
color8 #75715e
color9 #f92672
color10 #a6e22e
color11 #f4bf75
color12 #66d9ef
color13 #ae81ff
color14 #a1efe4
color15 #f9f8f5
