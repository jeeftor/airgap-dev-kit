add_newline = false
format = "$os$username$hostname $directory $character"
right_format = "$localip$shlvl$singularity$kubernetes$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$git_status$hg_branch$pijul_channel$docker_context$package$c$cmake$cobol$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$gleam$golang$guix_shell$haskell$haxe$helm$java$julia$kotlin$gradle$lua$nim$nodejs$ocaml$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$typst$vlang$vagrant$zig$buf$conda$meson$spack$memory_usage$aws$gcloud$openstack$azure$nats$direnv$crystal$custom$sudo$cmd_duration$line_break$jobs$battery$time$status$container$shell$env_var"

[character]
error_symbol = "[❯](red)[❯](yellow)[❯](red)"
success_symbol = "[❯](red)[❯](yellow)[❯](green)"
vicmd_symbol = "[❮](green)[❮](yellow)[❮](red)"

[cmd_duration]
format = "[$duration]($style) "

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "yellow"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = ""

[env_var.SSH_CONNECTION]
format = "[󰌘](yellow)"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style)"
style = "bold green"
symbol = " "

[git_status]
ahead = "[⬆](bold purple) "
behind = "[⬇](bold purple) "
conflicted = "[═](yellow) "
deleted = "[✖](red) "
diverged = "⇕ "
format = "$all_status$ahead_behind "
modified = "[✱](blue) "
renamed = "[➜](purple) "
staged = "[✚](green) "
stashed = "[✭](cyan) "
untracked = "[◼](white) "
up_to_date = ""

[hostname]
format = "[$ssh_symbol$hostname]($style)"
ssh_only = true
ssh_symbol = "@"
style = "bold green"

[line_break]
disabled = false

[os]
disabled = false
format = "$symbol"

[python]
format = "($virtualenv) "

[shlvl]
disabled = false
threshold = 2

[status]
disabled = false
symbol = "✘ "

[sudo]
disabled = false

[username]
disabled = false
format = "[$user]($style)"
show_always = true
style_root = "black bold"
style_user = "blue bold"
