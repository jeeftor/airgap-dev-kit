# ============================================================================
# Air-Gap Dev Kit - Fancy tmux Configuration
# ============================================================================

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Set scrollback buffer to 10000
set -g history-limit 10000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# ============================================================================
# Key Bindings
# ============================================================================

# Change prefix from 'Ctrl-b' to 'Ctrl-a'
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# Reload tmux config with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "✓ Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
#unbind '"'
#unbind %

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Shift-arrow without prefix
bind -n S-Left previous-window
bind -n S-Right next-window

# Resize panes using Ctrl-arrow with prefix
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5

# Quick pane switching with prefix + hjkl (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Synchronize panes (type in all panes at once)
bind S setw synchronize-panes \; display "Synchronize: #{?synchronize-panes,ON,OFF}"

# Kill pane without confirmation
bind x kill-pane

# Copy mode using vim keys
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# OS-specific clipboard integration
# macOS: use pbcopy
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
}

# Linux: use xclip or xsel if available
if-shell "uname | grep -q Linux" {
    if-shell "command -v xclip" {
        bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
        bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    }
    if-shell "command -v xsel" {
        bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel --clipboard --input"
        bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel --clipboard --input"
    }
}

# Enable clipboard integration
set -g set-clipboard on

# Enter copy mode with prefix + [
bind [ copy-mode

# ============================================================================
# Status Bar - Catppuccin Mocha Theme
# ============================================================================

# Status bar colors (Catppuccin Mocha)
set -g status-style bg=#1e1e2e,fg=#cdd6f4
set -g status-left-style bg=#1e1e2e,fg=#89b4fa
set -g status-right-style bg=#1e1e2e,fg=#cdd6f4

# Pane border colors
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#89b4fa

# Message colors
set -g message-style bg=#89b4fa,fg=#1e1e2e,bold
set -g message-command-style bg=#89b4fa,fg=#1e1e2e,bold

# Window status colors
setw -g window-status-style fg=#7f849c,bg=#1e1e2e
setw -g window-status-current-style fg=#1e1e2e,bg=#89b4fa,bold
setw -g window-status-activity-style fg=#f38ba8,bg=#1e1e2e

# Copy mode colors
setw -g mode-style bg=#89b4fa,fg=#1e1e2e,bold

# ============================================================================
# Status Bar Content
# ============================================================================

# Status bar position
set -g status-position bottom
set -g status-justify left

# Left status bar: Session name and window info
set -g status-left-length 50
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] 󰍉 #S #[fg=#89b4fa,bg=#313244] #[fg=#cdd6f4,bg=#313244] #I:#P #[fg=#313244,bg=#1e1e2e] "

# Right status bar: Host, date, time
set -g status-right-length 100
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] 󰒋 #{?client_prefix,PREFIX,      } #[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a] 󰒓 #(whoami)@#h #[fg=#89b4fa,bg=#45475a]#[fg=#1e1e2e,bg=#89b4fa,bold] 󰃭 #(date '+%b %-d %-I:%M%p' | tr '[:upper:]' '[:lower:]') "

# Window status format
setw -g window-status-format "#[fg=#7f849c,bg=#1e1e2e] #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W#{?window_flags,#{window_flags}, } "

# Window flags
setw -g window-status-separator ""

# ============================================================================
# Activity and Bell
# ============================================================================

# Monitor for activity in other windows
setw -g monitor-activity on
set -g visual-activity off

# Disable bell
set -g visual-bell off
set -g bell-action none

