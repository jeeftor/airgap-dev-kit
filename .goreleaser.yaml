version: 2

builds:
  - id: airgap-linux-amd64
    main: ./main.go
    binary: airgap
    goos: [linux]
    goarch: [amd64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}

archives:
  - id: binary-only
    formats: [tar.gz]
    builds: [airgap-linux-amd64]
    name_template: "airgap_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  disable: true
