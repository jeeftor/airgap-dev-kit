name: Update Air-Gap Kit

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
      - master  # Support both main and master branch names
      - 'feature/**'  # Test on feature branches but skip release      

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
      id-token: write  # Required for SLSA attestations
      attestations: write  # Required to store attestations
      artifact-metadata: write  # Required for artifact storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux binaries
        run: make update-linux

      - name: Download macOS binaries
        run: make update-macos

      - name: Install Go for gopls
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'

      - name: Install Neovim for Mason
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Set up Mason config
        run: |
          mkdir -p ~/.config/nvim
          cp .github/workflows/mason-config.lua ~/.config/nvim/init.lua

      - name: Install LSP servers via Mason
        run: |
          echo "Installing LSP servers using Mason..."
          
          # Install plugins first
          nvim --headless "+Lazy sync" +qa
          
          # Install essential LSP servers (Mason handles versions automatically)
          # Start with lua_ls (no Go dependency) to test Mason
          nvim --headless "+MasonInstall lua_ls" +qa
          
          # Then install others
          nvim --headless \
            "+MasonInstall gopls" \
            "+MasonInstall bashls" \
            "+MasonInstall jsonls" \
            "+MasonInstall yamlls" \
            "+MasonInstall marksman" \
            +qa
          
          echo "✓ LSP servers installed via Mason"

      - name: Package Mason for air-gap deployment
        run: |
          echo "Packaging Mason for air-gap deployment..."
          mkdir -p mason-airgap-package
          tar -czf mason-airgap-package/mason-lsp-kit.tar.gz -C ~/.local/share/nvim mason
          echo '#!/bin/bash' > mason-airgap-package/install-mason-airgap.sh
          echo 'set -e' >> mason-airgap-package/install-mason-airgap.sh
          echo 'MASON_DIR="$HOME/.local/share/nvim/mason"' >> mason-airgap-package/install-mason-airgap.sh
          echo 'PACKAGE_DIR="$(dirname "$0")"' >> mason-airgap-package/install-mason-airgap.sh
          echo 'echo "Installing Mason for air-gap Neovim..."' >> mason-airgap-package/install-mason-airgap.sh
          echo 'mkdir -p "$MASON_DIR"' >> mason-airgap-package/install-mason-airgap.sh
          echo 'if [[ -f "$PACKAGE_DIR/mason-lsp-kit.tar.gz" ]]; then' >> mason-airgap-package/install-mason-airgap.sh
          echo '    tar -xzf "$PACKAGE_DIR/mason-lsp-kit.tar.gz" -C "$(dirname "$MASON_DIR")"' >> mason-airgap-package/install-mason-airgap.sh
          echo '    echo "✓ Mason installation extracted"' >> mason-airgap-package/install-mason-airgap.sh
          echo 'else' >> mason-airgap-package/install-mason-airgap.sh
          echo '    echo "✗ Mason package not found"' >> mason-airgap-package/install-mason-airgap.sh
          echo '    exit 1' >> mason-airgap-package/install-mason-airgap.sh
          echo 'fi' >> mason-airgap-package/install-mason-airgap.sh
          echo 'find "$MASON_DIR" -name "*" -type f -executable -exec chmod +x {} \; 2>/dev/null || true' >> mason-airgap-package/install-mason-airgap.sh
          echo 'echo "✓ Mason air-gap installation complete!"' >> mason-airgap-package/install-mason-airgap.sh
          chmod +x mason-airgap-package/install-mason-airgap.sh
          echo '{"generated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","method":"headless-neovim-mason","servers_installed":["gopls@v0.21.1","lua_ls@3.7.4","bashls@3.0.4","jsonls@0.19.0","yamlls@0.10.0","marksman@0.2.1"],"total_package_size":"'$(du -sh mason-airgap-package/mason-lsp-kit.tar.gz | cut -f1)'"}' > mason-airgap-package/mason-manifest.json
          echo "✓ Mason air-gap package created"

      - name: Download fonts
        run: make update-fonts

      - name: Generate version metadata
        run: make version-file

      - name: Bundle Neovim plugins
        run: |
          echo "Setting up Neovim for plugin installation..."

          # Extract the downloaded Neovim binary
          cd $GITHUB_WORKSPACE/offline-packages/linux
          tar -xzf nvim-linux64.tar.gz

          # Set NVIM to the extracted binary path (tarball extracts to nvim-linux-x86_64/)
          NVIM="$GITHUB_WORKSPACE/offline-packages/linux/nvim-linux-x86_64/bin/nvim"

          # Verify Neovim is working
          $NVIM --version

          # Set up Neovim config from repo
          mkdir -p ~/.config/nvim
          if [[ -d $GITHUB_WORKSPACE/config/.config/nvim ]]; then
            cp -r $GITHUB_WORKSPACE/config/.config/nvim/* ~/.config/nvim/
            echo "Neovim config copied from repo"
          else
            echo "Warning: No Neovim config found in config/.config/nvim/"
            echo "Skipping plugin installation"
            exit 0
          fi

          # Temporarily enable plugin installation for GitHub Actions build
          # This overrides the air-gap setting in lazy.lua
          echo "Enabling plugin installation for build..."
          sed -i 's/missing = false/missing = true/' ~/.config/nvim/lua/config/lazy.lua

          # Install plugins using lazy.nvim (headless mode)
          echo "Installing Neovim plugins with lazy.nvim..."
          echo "This may take 2-3 minutes for all plugins and Treesitter parsers..."
          $NVIM --headless "+Lazy! sync" +qa

          # Run a second time to catch any dependencies that needed other plugins first
          echo "Running second sync to ensure all dependencies are installed..."
          $NVIM --headless "+Lazy! sync" +qa

          # Install Mason LSP servers and tools using Lua script
          echo "Installing Mason LSP servers and tools..."
          cat > /tmp/mason-install.lua <<'MASON_EOF'
          -- Wait for Mason to be ready
          local mason_registry = require("mason-registry")

          -- List of packages to install
          local packages = {
            "lua-language-server",
            "pyright",
            "typescript-language-server",
            "bash-language-server",
            "json-lsp",
            "yaml-language-server",
            "gopls",
            "rust-analyzer",
            "clangd",
            "stylua",
            "black",
            "prettier",
            "shfmt",
            "shellcheck",
            "eslint_d",
            "pylint"
          }

          -- Refresh registry
          mason_registry.refresh()

          -- Install each package
          for _, pkg_name in ipairs(packages) do
            local ok, pkg = pcall(mason_registry.get_package, pkg_name)
            if ok then
              if not pkg:is_installed() then
                print("Installing " .. pkg_name .. "...")
                pkg:install()
              else
                print("✓ " .. pkg_name .. " already installed")
              end
            else
              print("✗ Package not found: " .. pkg_name)
            end
          end

          -- Wait for installations to complete
          local max_wait = 120  -- 2 minutes max
          local waited = 0
          while waited < max_wait do
            local all_done = true
            for _, pkg_name in ipairs(packages) do
              local ok, pkg = pcall(mason_registry.get_package, pkg_name)
              if ok and not pkg:is_installed() then
                all_done = false
                break
              end
            end
            if all_done then
              print("All packages installed successfully!")
              break
            end
            vim.wait(1000)
            waited = waited + 1
          end

          -- Print final status
          print("\nFinal installation status:")
          for _, pkg_name in ipairs(packages) do
            local ok, pkg = pcall(mason_registry.get_package, pkg_name)
            if ok then
              if pkg:is_installed() then
                print("✓ " .. pkg_name)
              else
                print("✗ " .. pkg_name .. " (failed to install)")
              end
            end
          end
          MASON_EOF

          # Run the Lua script with Neovim
          $NVIM --headless -c "luafile /tmp/mason-install.lua" -c "qa"

          echo "Mason installation complete"

          # Restore air-gap setting (though we don't commit this)
          sed -i 's/missing = true/missing = false/' ~/.config/nvim/lua/config/lazy.lua

          # Verify plugins were installed
          if [[ -d ~/.local/share/nvim/lazy ]]; then
            echo "Plugins installed successfully:"
            ls -la ~/.local/share/nvim/lazy/
          else
            echo "Warning: No plugins directory found"
            exit 0
          fi

          # Verify Mason packages were installed
          if [[ -d ~/.local/share/nvim/mason ]]; then
            echo "Mason packages installed successfully:"
            ls -la ~/.local/share/nvim/mason/packages/
          else
            echo "Warning: No Mason packages directory found"
          fi

          # Bundle plugins and Mason packages into tarball
          echo "Bundling plugins and Mason LSP servers..."
          cd ~/.local/share/nvim

          # Include lazy-lock.json if it exists
          if [[ -f ~/.config/nvim/lazy-lock.json ]]; then
            echo "Including lazy-lock.json from config directory"
            cp ~/.config/nvim/lazy-lock.json .
          fi

          # Create tarball with plugins and Mason packages
          if [[ -d mason ]] && [[ -f lazy-lock.json ]]; then
            tar -czf lazy-plugins.tar.gz lazy/ mason/ lazy-lock.json
          elif [[ -d mason ]]; then
            tar -czf lazy-plugins.tar.gz lazy/ mason/
          elif [[ -f lazy-lock.json ]]; then
            tar -czf lazy-plugins.tar.gz lazy/ lazy-lock.json
          else
            echo "No lazy-lock.json or Mason found, bundling plugins only"
            tar -czf lazy-plugins.tar.gz lazy/
          fi

          # Move to offline-packages
          mv lazy-plugins.tar.gz $GITHUB_WORKSPACE/offline-packages/

          echo "✓ Neovim plugins bundled to offline-packages/lazy-plugins.tar.gz"
          ls -lh $GITHUB_WORKSPACE/offline-packages/lazy-plugins.tar.gz

      - name: Verify binaries
        run: make verify

      - name: Create platform-specific packages
        run: |
          # Create staging directories
          mkdir -p staging-linux/airgap-dev-kit/offline-packages
          mkdir -p staging-macos/airgap-dev-kit/offline-packages

          # Copy common files
          cp install.sh shell-setup-example.sh staging-linux/airgap-dev-kit/
          cp install.sh shell-setup-example.sh staging-macos/airgap-dev-kit/
          if [[ -f VERSION ]]; then
            cp VERSION staging-linux/airgap-dev-kit/
            cp VERSION staging-macos/airgap-dev-kit/
          else
            echo "Warning: VERSION file not found; installer will show 'unknown'."
          fi
          cp -r fonts config staging-linux/airgap-dev-kit/
          cp -r fonts config staging-macos/airgap-dev-kit/

          # Copy platform-specific binaries
          cp -r offline-packages/linux staging-linux/airgap-dev-kit/offline-packages/
          cp offline-packages/lazy-plugins.tar.gz staging-linux/airgap-dev-kit/offline-packages/

          cp -r offline-packages/macos staging-macos/airgap-dev-kit/offline-packages/
          cp offline-packages/lazy-plugins.tar.gz staging-macos/airgap-dev-kit/offline-packages/

          # Ensure gum is included in both packages
          echo "Verifying gum is included..."
          ls -lh staging-linux/airgap-dev-kit/offline-packages/linux/gum || echo "Warning: gum not found for Linux"
          ls -lh staging-macos/airgap-dev-kit/offline-packages/macos/gum || echo "Warning: gum not found for macOS"

          # Create tarballs with proper directory structure
          echo "Creating Linux x86_64 package..."
          tar -czf airgap-dev-kit-linux-x86_64.tar.gz -C staging-linux airgap-dev-kit

          echo "Creating macOS ARM64 package..."
          tar -czf airgap-dev-kit-macos-arm64.tar.gz -C staging-macos airgap-dev-kit

          echo "Creating combined package (both platforms)..."
          make package

          # Clean up staging
          rm -rf staging-linux staging-macos

          echo "Packages created:"
          ls -lh airgap-dev-kit*.tar.gz

      - name: Calculate checksums
        run: |
          sha256sum airgap-dev-kit-linux-x86_64.tar.gz > checksums.txt
          sha256sum airgap-dev-kit-macos-arm64.tar.gz >> checksums.txt
          sha256sum airgap-dev-kit.tar.gz >> checksums.txt
          echo "Checksums:"
          cat checksums.txt

      - name: Feature Branch Test Summary
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          echo "✓ Build completed successfully on feature branch!"
          echo "📦 Packages built (but not released):"
          ls -lh airgap-dev-kit*.tar.gz
          echo ""
          echo "Note: Release creation skipped for feature branches."
          echo "Merge to main/master to create a release."

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_id }}
          name: Air-Gap Dev Kit - Build ${{ github.run_number }}
          body: |
            # Air-Gap Development Kit - Automated Build

            **Build Date:** ${{ github.event.repository.updated_at }}
            **Run Number:** ${{ github.run_number }}

            ## 📦 Available Packages

            Choose the package for your platform:

            | Package | Platform | Size | Description |
            |---------|----------|------|-------------|
            | **airgap-dev-kit-linux-x86_64.tar.gz** | Linux x86_64 | ~200MB | Linux-only binaries |
            | **airgap-dev-kit-macos-arm64.tar.gz** | macOS ARM64 | ~150MB | macOS-only binaries (Apple Silicon) |
            | **airgap-dev-kit.tar.gz** | Both | ~350MB | Combined (use if you have mixed environments) |
            | **checksums.txt** | All | <1KB | SHA256 checksums for verification |

            ## 🚀 Quick Start - Linux (x86_64)

            **Using wget:**
            ```bash
            wget https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-linux-x86_64.tar.gz
            wget https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/checksums.txt
            sha256sum -c checksums.txt
            tar -xzf airgap-dev-kit-linux-x86_64.tar.gz
            cd airgap-dev-kit
            ./install.sh
            ```

            **Using curl:**
            ```bash
            curl -LO https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-linux-x86_64.tar.gz
            curl -LO https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/checksums.txt
            sha256sum -c checksums.txt
            tar -xzf airgap-dev-kit-linux-x86_64.tar.gz
            cd airgap-dev-kit
            ./install.sh
            ```

            **One-liner (curl + extract + install):**
            ```bash
            curl -L https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-linux-x86_64.tar.gz | tar -xz && cd airgap-dev-kit && ./install.sh
            ```

            ## 🍎 Quick Start - macOS (ARM64 / Apple Silicon)

            **Using wget:**
            ```bash
            wget https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-macos-arm64.tar.gz
            wget https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/checksums.txt
            shasum -a 256 -c checksums.txt
            tar -xzf airgap-dev-kit-macos-arm64.tar.gz
            cd airgap-dev-kit
            ./install.sh
            ```

            **Using curl:**
            ```bash
            curl -LO https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-macos-arm64.tar.gz
            curl -LO https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/checksums.txt
            shasum -a 256 -c checksums.txt
            tar -xzf airgap-dev-kit-macos-arm64.tar.gz
            cd airgap-dev-kit
            ./install.sh
            ```

            **One-liner (curl + extract + install):**
            ```bash
            curl -L https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-macos-arm64.tar.gz | tar -xz && cd airgap-dev-kit && ./install.sh
            ```

            ## 🔒 Air-Gap Installation

            1. **Transfer** package to air-gapped machine via USB/CD
            2. **Extract:** `tar -xzf airgap-dev-kit-<platform>.tar.gz`
            3. **Install:** `cd airgap-dev-kit && ./install.sh`
            4. **Add to PATH:** `export PATH="$HOME/bin:$PATH"` (add to `~/.bashrc` or `~/.zshrc`)
            5. **Launch:** `wezterm start -- tmux new-session nvim`

            ## ✨ Features
            - **Interactive Installation**: Smart version detection with prompts before overwriting existing tools
            - **Pretty TUI**: Uses [Charm Bracelet Gum](https://github.com/charmbracelet/gum) for beautiful prompts
            - **Flexible Installation**: Install to `/usr/local/bin` (system-wide) or `~/bin` (user-local)
            - **SSH-Friendly**: Detects headless environments and provides appropriate instructions

            ## 📦 Binaries Included
            
            **Core Tools:**
            - WezTerm (terminal emulator)
            - Neovim (text editor with plugins)
            - tmux (terminal multiplexer)
            - fzf (fuzzy finder)
            - fd (better find)
            - ripgrep (better grep)
            - bat (better cat)
            - starship (prompt)
            - gum (TUI toolkit)
            
            **New Essential Tools:**
            - **lazygit** (git TUI)
            - **zoxide** (smarter cd)
            - **delta** (git diff viewer)
            - **jq** (JSON processor)
            - **btop** (system monitor)
            
            **Optional:**
            - lsd/eza (better ls)
            - GNU Stow (dotfile manager)
            
            **Extras:**
            - JetBrainsMono Nerd Font
            - Neovim plugins (via lazy.nvim)

            ---

            *This release was automatically generated by GitHub Actions*
          files: |
            airgap-dev-kit-linux-x86_64.tar.gz
            airgap-dev-kit-macos-arm64.tar.gz
            airgap-dev-kit.tar.gz
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airgap-dev-kit-build-${{ github.run_number }}
          path: |
            airgap-dev-kit.tar.gz
            offline-packages/lazy-plugins.tar.gz
            checksums.txt
            lsp-manifest.json
            mason-airgap-package/
          retention-days: 30

      - name: Cleanup old releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "Keeping only the last 3 releases..."

          # Get all releases sorted by creation date (newest first)
          RELEASES=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          RELEASE_COUNT=$(echo "$RELEASES" | grep -c . || true)

          if [[ "$RELEASE_COUNT" -le 3 ]]; then
            echo "Only $RELEASE_COUNT releases found. Nothing to clean up."
            exit 0
          fi

          # Skip first 3, delete the rest
          echo "$RELEASES" | tail -n +4 | while read -r tag; do
            if [[ -n "$tag" ]]; then
              echo "Deleting old release: $tag"
              if ! gh release delete "$tag" --yes --cleanup-tag; then
                echo "⚠️ Warning: failed to delete release $tag (continuing)" >&2
              fi
            fi
          done

          echo "✓ Cleanup complete. Kept last 3 releases."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA attestations
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: airgap-dev-kit-linux-x86_64.tar.gz

      - name: Generate SLSA attestations for macOS
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: airgap-dev-kit-macos-arm64.tar.gz

      - name: Generate SLSA attestations for combined package
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: airgap-dev-kit.tar.gz

      - name: Generate SLSA attestations for checksums
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: checksums.txt
