name: Update Air-Gap Kit

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
      - master  # Support both main and master branch names
      - 'feature/**'  # Test on feature branches but skip release      

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
      id-token: write  # Required for SLSA attestations
      attestations: write  # Required to store attestations
      artifact-metadata: write  # Required for artifact storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux binaries
        run: make update-linux

      - name: Download fonts
        run: make update-fonts

      - name: Generate version metadata
        run: make version-file

      - name: Bundle Neovim plugins
        run: |
          echo "Setting up Neovim for plugin installation..."

          # Use the official Neovim binary with its bundled runtime
          NVIM="$GITHUB_WORKSPACE/offline-packages/linux/nvim-static-x86_64"
          NVIM_RUNTIME="$GITHUB_WORKSPACE/offline-packages/linux/nvim-runtime"

          # Ensure it's executable
          chmod +x "$NVIM"

          # Point to bundled runtime so vim.uri and other built-ins resolve correctly
          export VIMRUNTIME="$NVIM_RUNTIME"

          # Verify Neovim is working
          $NVIM --version

          # Set up Neovim config from repo
          mkdir -p ~/.config/nvim
          if [[ -d $GITHUB_WORKSPACE/config/nvim/.config/nvim ]]; then
            cp -r $GITHUB_WORKSPACE/config/nvim/.config/nvim/* ~/.config/nvim/
            echo "Neovim config copied from repo"
          else
            echo "Warning: No Neovim config found in config/nvim/.config/nvim/"
            echo "Skipping plugin installation"
            exit 0
          fi

          # Temporarily enable plugin installation for GitHub Actions build
          # This overrides the air-gap setting in lazy.lua
          echo "Enabling plugin installation for build..."
          sed -i 's/missing = false/missing = true/' ~/.config/nvim/lua/config/lazy.lua

          # Install plugins using lazy.nvim (headless mode)
          echo "Installing Neovim plugins with lazy.nvim..."
          echo "This may take 2-3 minutes for all plugins and Treesitter parsers..."

          # Single sync - Install LazyVim plugins only (no Mason yet)
          $NVIM --headless "+Lazy! sync" +qa

          # Restore air-gap setting
          sed -i 's/missing = true/missing = false/' ~/.config/nvim/lua/config/lazy.lua

          # Verify plugins were installed
          if [[ -d ~/.local/share/nvim/lazy ]]; then
            echo "Plugins installed successfully:"
            ls -la ~/.local/share/nvim/lazy/
          else
            echo "Warning: No plugins directory found"
            exit 0
          fi

          # Bundle LazyVim plugins into tarball (Mason packages handled separately)
          echo "Bundling LazyVim plugins..."
          cd ~/.local/share/nvim

          # Include lazy-lock.json if it exists
          if [[ -f ~/.config/nvim/lazy-lock.json ]]; then
            echo "Including lazy-lock.json from config directory"
            cp ~/.config/nvim/lazy-lock.json .
          fi

          # Create tarball with plugins and lazy-lock.json
          if [[ -f lazy-lock.json ]]; then
            tar -czf lazy-plugins.tar.gz lazy/ lazy-lock.json
          else
            echo "No lazy-lock.json found, bundling plugins only"
            tar -czf lazy-plugins.tar.gz lazy/
          fi

          # Move to offline-packages
          mv lazy-plugins.tar.gz $GITHUB_WORKSPACE/offline-packages/

          echo "✓ LazyVim plugins bundled to offline-packages/lazy-plugins.tar.gz"
          ls -lh $GITHUB_WORKSPACE/offline-packages/lazy-plugins.tar.gz

      - name: Install LSP servers with vanilla Neovim + Mason (experimental)
        run: |
          echo "=========================================="
          echo "EXPERIMENTAL: Installing LSP servers"
          echo "Using vanilla Neovim + Mason (not LazyVim)"
          echo "=========================================="

          # Use the official Neovim binary with its bundled runtime
          NVIM="$GITHUB_WORKSPACE/offline-packages/linux/nvim-static-x86_64"
          export VIMRUNTIME="$GITHUB_WORKSPACE/offline-packages/linux/nvim-runtime"
          chmod +x "$NVIM"

          # Create minimal Mason config in a separate directory
          MASON_CONFIG="$HOME/.config/nvim-mason-test"
          mkdir -p "$MASON_CONFIG/lua"

          # Create minimal init.lua that only loads Mason
          cat > "$MASON_CONFIG/init.lua" <<'INIT_EOF'
          -- Minimal config for Mason LSP installation
          local lazypath = vim.fn.stdpath("data") .. "/lazy-mason/lazy.nvim"
          if not vim.loop.fs_stat(lazypath) then
            vim.fn.system({
              "git", "clone", "--filter=blob:none",
              "https://github.com/folke/lazy.nvim.git",
              "--branch=stable",
              lazypath,
            })
          end
          vim.opt.rtp:prepend(lazypath)

          require("lazy").setup({
            {
              "williamboman/mason.nvim",
              build = ":MasonUpdate",
            },
          })
          INIT_EOF

          echo "Installing Mason plugin..."
          NVIM_APPNAME=nvim-mason-test $NVIM --headless "+Lazy! sync" +qa

          echo "Installing LSP servers, formatters, and linters..."
          cat > /tmp/mason-lsp-install.lua <<'LSP_EOF'
          vim.env.NVIM_APPNAME = "nvim-mason-test"

          -- Initialize Mason
          require("mason").setup()
          local registry = require("mason-registry")

          local packages = {
            "lua-language-server", "pyright", "typescript-language-server",
            "bash-language-server", "json-lsp",
            "yaml-language-server", "gopls", "rust-analyzer", "clangd",
            "stylua", "black", "prettier", "shfmt",
            "shellcheck", "eslint_d", "flake8"
          }

          print("\n=== Starting Mason LSP installations ===")
          registry:refresh()

          local installed_count = 0
          for _, pkg_name in ipairs(packages) do
            local ok, pkg = pcall(registry.get_package, pkg_name)
            if ok then
              if not pkg:is_installed() then
                print(string.format("[%d/%d] Installing %s...", installed_count + 1, #packages, pkg_name))
                pkg:install():once("closed", function()
                  installed_count = installed_count + 1
                  print(string.format("  ✓ %s installed", pkg_name))
                end)
              else
                print(string.format("  ✓ %s already installed", pkg_name))
                installed_count = installed_count + 1
              end
            else
              print(string.format("  ✗ Failed to get package: %s", pkg_name))
            end
          end

          -- Wait for all installations to complete (max 5 minutes)
          print("\nWaiting for installations to complete...")
          local max_wait = 300
          for i = 1, max_wait do
            local current_installed = #registry:get_installed_packages()
            if current_installed >= #packages then
              print(string.format("\n✓ All %d packages installed!", current_installed))
              break
            end
            if i % 10 == 0 then
              print(string.format("  Progress: %d/%d packages installed...", current_installed, #packages))
            end
            vim.wait(1000)
          end

          print("\n=== Installation Summary ===")
          local installed_packages = registry:get_installed_packages()
          print(string.format("Total installed: %d/%d", #installed_packages, #packages))
          for _, pkg in ipairs(installed_packages) do
            print("  ✓ " .. pkg.name)
          end

          local missing = {}
          for _, pkg_name in ipairs(packages) do
            local ok, pkg = pcall(registry.get_package, pkg_name)
            if ok and not pkg:is_installed() then
              table.insert(missing, pkg_name)
            end
          end

          if #missing > 0 then
            print("\n⚠ Missing packages:")
            for _, name in ipairs(missing) do
              print("  ✗ " .. name)
            end
          end
          LSP_EOF

          NVIM_APPNAME=nvim-mason-test $NVIM --headless -c "luafile /tmp/mason-lsp-install.lua" -c "qa"

          # Verify installations
          echo ""
          echo "=========================================="
          echo "Verifying Mason LSP installations..."
          echo "=========================================="

          MASON_PACKAGES_DIR="$HOME/.local/share/nvim-mason-test/mason/packages"
          if [[ -d "$MASON_PACKAGES_DIR" ]]; then
            INSTALLED_COUNT=$(ls -1 "$MASON_PACKAGES_DIR" | wc -l)
            echo "✓ Found $INSTALLED_COUNT packages in $MASON_PACKAGES_DIR"
            echo ""
            echo "Installed packages:"
            ls -1 "$MASON_PACKAGES_DIR" | while read pkg; do
              echo "  ✓ $pkg"
            done

            # Only package if we have at least 10 packages (out of 17 expected)
            if [[ $INSTALLED_COUNT -ge 10 ]]; then
              echo ""
              echo "=========================================="
              echo "✓ SUCCESS: $INSTALLED_COUNT packages installed"
              echo "Packaging Mason LSP servers..."
              echo "=========================================="

              cd "$HOME/.local/share/nvim-mason-test"
              tar -czf mason-lsp.tar.gz mason/
              mv mason-lsp.tar.gz $GITHUB_WORKSPACE/offline-packages/

              echo "✓ Mason LSP servers packaged to offline-packages/mason-lsp.tar.gz"
              ls -lh $GITHUB_WORKSPACE/offline-packages/mason-lsp.tar.gz
            else
              echo ""
              echo "=========================================="
              echo "⚠ WARNING: Only $INSTALLED_COUNT packages installed (expected 17)"
              echo "Not packaging Mason LSP servers yet"
              echo "This is experimental - existing LazyVim plugins are unaffected"
              echo "=========================================="
            fi
          else
            echo "⚠ WARNING: Mason packages directory not found"
            echo "This is experimental - existing LazyVim plugins are unaffected"
          fi

      - name: Verify binaries
        run: make verify

      - name: Create platform-specific packages
        run: |
          # Create staging directories
          mkdir -p staging-linux/airgap-dev-kit/offline-packages

          # Copy common files
          cp install.sh shell-setup-example.sh staging-linux/airgap-dev-kit/
          if [[ -f VERSION ]]; then
            cp VERSION staging-linux/airgap-dev-kit/
          else
            echo "Warning: VERSION file not found; installer will show 'unknown'."
          fi
          cp -r fonts config staging-linux/airgap-dev-kit/

          # Copy platform-specific binaries
          cp -r offline-packages/linux staging-linux/airgap-dev-kit/offline-packages/
          cp offline-packages/lazy-plugins.tar.gz staging-linux/airgap-dev-kit/offline-packages/

          # Ensure gum is included in the Linux package
          echo "Verifying gum is included..."
          ls -lh staging-linux/airgap-dev-kit/offline-packages/linux/gum || echo "Warning: gum not found for Linux"

          # Create tarballs with proper directory structure
          echo "Creating Linux x86_64 package..."
          tar -czf airgap-dev-kit-linux-x86_64.tar.gz -C staging-linux airgap-dev-kit

          echo "Creating default Linux package..."
          make package

          # Clean up staging
          rm -rf staging-linux

          echo "Packages created:"
          ls -lh airgap-dev-kit*.tar.gz

      - name: Calculate checksums
        run: |
          sha256sum airgap-dev-kit-linux-x86_64.tar.gz > checksums.txt
          sha256sum airgap-dev-kit.tar.gz >> checksums.txt
          echo "Checksums:"
          cat checksums.txt

      - name: Feature Branch Test Summary
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          echo "✓ Build completed successfully on feature branch!"
          echo "📦 Packages built (but not released):"
          ls -lh airgap-dev-kit*.tar.gz
          echo ""
          echo "Note: Release creation skipped for feature branches."
          echo "Merge to main/master to create a release."

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_id }}
          name: Air-Gap Dev Kit - Build ${{ github.run_number }}
          body: |
            # Air-Gap Development Kit - Automated Build

            **Build Date:** ${{ github.event.repository.updated_at }}
            **Run Number:** ${{ github.run_number }}

            ## 📦 Available Packages

            | Package | Platform | Size | Description |
            |---------|----------|------|-------------|
            | **airgap-dev-kit-linux-x86_64.tar.gz** | Linux x86_64 | ~200MB | Linux-only binaries |
            | **airgap-dev-kit.tar.gz** | Linux x86_64 | ~200MB | Default Linux package |
            | **checksums.txt** | All | <1KB | SHA256 checksums for verification |

            ## 🚀 Quick Start - Linux (x86_64)

            **Using wget:**
            ```bash
            wget https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-linux-x86_64.tar.gz
            wget https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/checksums.txt
            sha256sum -c checksums.txt
            tar -xzf airgap-dev-kit-linux-x86_64.tar.gz
            cd airgap-dev-kit
            ./install.sh
            ```

            **Using curl:**
            ```bash
            curl -LO https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-linux-x86_64.tar.gz
            curl -LO https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/checksums.txt
            sha256sum -c checksums.txt
            tar -xzf airgap-dev-kit-linux-x86_64.tar.gz
            cd airgap-dev-kit
            ./install.sh
            ```

            **One-liner (curl + extract + install):**
            ```bash
            curl -L https://github.com/jeeftor/airgap-dev-kit/releases/download/build-${{ github.run_number }}-${{ github.run_id }}/airgap-dev-kit-linux-x86_64.tar.gz | tar -xz && cd airgap-dev-kit && ./install.sh
            ```

            ## 🔒 Air-Gap Installation

            1. **Transfer** package to air-gapped machine via USB/CD
            2. **Extract:** `tar -xzf airgap-dev-kit-<platform>.tar.gz`
            3. **Install:** `cd airgap-dev-kit && ./install.sh`
            4. **Add to PATH:** `export PATH="$HOME/bin:$PATH"` (add to `~/.bashrc` or `~/.zshrc`)
            5. **Launch:** `wezterm start -- tmux new-session nvim`

            ## ✨ Features
            - **Interactive Installation**: Smart version detection with prompts before overwriting existing tools
            - **Pretty TUI**: Uses [Charm Bracelet Gum](https://github.com/charmbracelet/gum) for beautiful prompts
            - **Flexible Installation**: Install to `/usr/local/bin` (system-wide) or `~/bin` (user-local)
            - **SSH-Friendly**: Detects headless environments and provides appropriate instructions

            ## 📦 Binaries Included
            
            **Core Tools:**
            - WezTerm (terminal emulator)
            - Neovim (text editor with plugins)
            - tmux (terminal multiplexer)
            - fzf (fuzzy finder)
            - fd (better find)
            - ripgrep (better grep)
            - bat (better cat)
            - starship (prompt)
            - gum (TUI toolkit)
            
            **New Essential Tools:**
            - **lazygit** (git TUI)
            - **zoxide** (smarter cd)
            - **delta** (git diff viewer)
            - **jq** (JSON processor)
            - **btop** (system monitor)
            
            **Optional:**
            - lsd/eza (better ls)
            - GNU Stow (dotfile manager)
            
            **Extras:**
            - JetBrainsMono Nerd Font
            - Neovim plugins (via lazy.nvim)

            ---

            *This release was automatically generated by GitHub Actions*
          files: |
            airgap-dev-kit-linux-x86_64.tar.gz
            airgap-dev-kit.tar.gz
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airgap-dev-kit-build-${{ github.run_number }}
          path: |
            airgap-dev-kit-linux-x86_64.tar.gz
            airgap-dev-kit.tar.gz
            offline-packages/lazy-plugins.tar.gz
            checksums.txt
          retention-days: 30

      - name: Cleanup old releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "Keeping only the last 3 releases..."

          # Get all releases sorted by creation date (newest first)
          RELEASES=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          RELEASE_COUNT=$(echo "$RELEASES" | grep -c . || true)

          if [[ "$RELEASE_COUNT" -le 3 ]]; then
            echo "Only $RELEASE_COUNT releases found. Nothing to clean up."
            exit 0
          fi

          # Skip first 3, delete the rest
          echo "$RELEASES" | tail -n +4 | while read -r tag; do
            if [[ -n "$tag" ]]; then
              echo "Deleting old release: $tag"
              if ! gh release delete "$tag" --yes --cleanup-tag; then
                echo "⚠️ Warning: failed to delete release $tag (continuing)" >&2
              fi
            fi
          done

          echo "✓ Cleanup complete. Kept last 3 releases."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA attestations
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: airgap-dev-kit-linux-x86_64.tar.gz

      - name: Generate SLSA attestations for combined package
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: airgap-dev-kit.tar.gz

      - name: Generate SLSA attestations for checksums
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: checksums.txt
