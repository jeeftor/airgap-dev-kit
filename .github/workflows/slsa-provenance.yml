name: SLSA Attestations

on:
  workflow_run:
    workflows: ["Update Air-Gap Kit"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    name: Generate SLSA attestations
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: airgap-dev-kit-build-*
          merge-multiple: true
          path: artifacts

      - name: Attest Linux package
        uses: actions/attest@v4
        with:
          subject-path: artifacts/airgap-dev-kit-linux-x86_64.tar.gz

      - name: Attest combined package
        uses: actions/attest@v4
        with:
          subject-path: artifacts/airgap-dev-kit.tar.gz

      - name: Attest CLI-only package
        uses: actions/attest@v4
        with:
          subject-path: artifacts/airgap-dev-kit-cli.tar.gz

      - name: Attest checksums
        uses: actions/attest@v4
        with:
          subject-path: artifacts/checksums.txt
