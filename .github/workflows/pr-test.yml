name: PR Tests

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-manifest-system:
    name: Test DRY Manifest System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Install Docker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Build test Docker image
        run: |
          docker build -f test/test-mason.Dockerfile -t airgap-mason-test . || {
            echo "❌ Docker build failed"
            exit 1
          }

      - name: Test manifest-based installation
        run: |
          docker run --rm \
            -v $(pwd):/workspace \
            -e MANIFEST_PATH=/workspace/config/plugin-manifest.lua \
            airgap-mason-test bash /workspace/test/test-with-manifest.sh

      - name: Verify installation results
        run: |
          # Run a container and check what was installed
          docker run --rm \
            -v $(pwd):/workspace \
            -e MANIFEST_PATH=/workspace/config/plugin-manifest.lua \
            airgap-mason-test bash -c "
              /workspace/scripts/install-from-manifest.sh > /tmp/install.log 2>&1 || true

              echo '=== LazyVim Plugins ==='
              ls -1 ~/.local/share/nvim/lazy 2>/dev/null | wc -l || echo '0'

              echo '=== Mason Packages ==='
              ls -1 ~/.local/share/nvim/mason/packages 2>/dev/null | wc -l || echo '0'
            "

  test-binary-package:
    name: Test Binary Package Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Test Makefile targets
        run: |
          # Verify Makefile syntax
          make help || {
            echo "❌ Makefile help target failed"
            exit 1
          }

          echo "✅ Makefile syntax OK"

          # Check if DRY targets exist (if this is a DRY PR)
          if grep -q "plugin-manifest" Makefile; then
            echo "📋 DRY manifest system detected, checking targets..."

            grep -q "test-manifest:" Makefile || {
              echo "❌ Missing test-manifest target"
              exit 1
            }

            grep -q "test-package-manifest:" Makefile || {
              echo "❌ Missing test-package-manifest target"
              exit 1
            }

            echo "✅ DRY Makefile targets verified"
          else
            echo "ℹ️  DRY system not present (this PR may not include it)"
          fi

      - name: Verify manifest file
        run: |
          # Check manifest exists and is valid Lua
          test -f config/plugin-manifest.lua || {
            echo "❌ Missing config/plugin-manifest.lua"
            exit 1
          }

          # Very basic Lua syntax check (won't catch all errors)
          grep -q "return {" config/plugin-manifest.lua || {
            echo "❌ Manifest doesn't return a table"
            exit 1
          }

          echo "✅ Manifest file exists"

      - name: Verify install script
        run: |
          test -x scripts/install-from-manifest.sh || {
            echo "❌ scripts/install-from-manifest.sh not executable"
            exit 1
          }

          echo "✅ Install script is executable"

  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          # Install shellcheck
          sudo apt-get update
          sudo apt-get install -y shellcheck

          # Check install script
          shellcheck scripts/install-from-manifest.sh || {
            echo "⚠️ Shellcheck warnings in install-from-manifest.sh"
          }

          # Check test scripts
          shellcheck test/test-with-manifest.sh || {
            echo "⚠️ Shellcheck warnings in test scripts"
          }

      - name: Verify documentation exists
        run: |
          test -f docs/QUICK-START-DRY.md || echo "⚠️ Missing QUICK-START-DRY.md"
          test -f docs/DRY-WORKFLOW.md || echo "⚠️ Missing DRY-WORKFLOW.md"
          test -f docs/ARCHITECTURE.md || echo "⚠️ Missing ARCHITECTURE.md"

          echo "✅ Documentation check complete"

      - name: Summary
        run: |
          echo "## PR Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All PR tests passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Validated" >> $GITHUB_STEP_SUMMARY
          echo "- config/plugin-manifest.lua" >> $GITHUB_STEP_SUMMARY
          echo "- scripts/install-from-manifest.sh" >> $GITHUB_STEP_SUMMARY
          echo "- test/test-with-manifest.sh" >> $GITHUB_STEP_SUMMARY
          echo "- Makefile" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation" >> $GITHUB_STEP_SUMMARY
