name: Build Neovim Packages from Manifest

on:
  push:
    branches: [ main, master ]
    paths:
      - 'config/plugin-manifest.lua'
      - '.github/workflows/build-nvim-packages.yml'
      - 'scripts/install-from-manifest.sh'
  workflow_dispatch:
  schedule:
    # Run weekly to get plugin updates
    - cron: '0 0 * * 0'

jobs:
  build-nvim-packages:
    name: Build ${{ matrix.os }} Packages
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            arch: x86_64
          - os: macos
            runner: macos-latest
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up cache for Neovim packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/nvim/lazy
            ~/.local/share/nvim/mason
          key: nvim-packages-${{ hashFiles('config/plugin-manifest.lua') }}
          restore-keys: |
            nvim-packages-

      - name: Install Neovim dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget \
            ripgrep fd-find fzf \
            nodejs npm \
            python3-neovim \
            build-essential cmake ninja-build gettext

          # Create fd symlink (Ubuntu packages it as fdfind)
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - name: Install Neovim dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install \
            git curl wget \
            ripgrep fd fzf \
            node \
            ninja cmake gettext

      - name: Build Neovim from source
        run: |
          cd /tmp
          git clone --depth 1 --branch v0.11.2 https://github.com/neovim/neovim.git
          cd neovim
          make CMAKE_BUILD_TYPE=RelWithDebInfo
          sudo make install
          nvim --version

      - name: Install plugins from manifest
        env:
          MANIFEST_PATH: ${{ github.workspace }}/config/plugin-manifest.lua
          WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x ${{ github.workspace }}/scripts/install-from-manifest.sh
          ${{ github.workspace }}/scripts/install-from-manifest.sh

      - name: Package LazyVim plugins
        run: |
          mkdir -p packages
          cd ~/.local/share/nvim
          tar -czf ${{ github.workspace }}/packages/lazyvim-plugins-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazy/
          echo "LazyVim package size: $(du -sh lazy/ | cut -f1)"
          echo "LazyVim plugins: $(ls -1 lazy/ | wc -l)"

      - name: Package Mason packages
        run: |
          if [ -d ~/.local/share/nvim/mason/packages ]; then
            cd ~/.local/share/nvim/mason
            tar -czf ${{ github.workspace }}/packages/mason-packages-${{ matrix.os }}-${{ matrix.arch }}.tar.gz packages/
            echo "Mason package size: $(du -sh packages/ | cut -f1)"
            echo "Mason packages: $(ls -1 packages/ | wc -l)"
          else
            echo "No Mason packages to package"
          fi

      - name: Generate package manifest
        run: |
          cat > packages/MANIFEST.txt << EOF
          # Neovim Packages Built from plugin-manifest.lua
          # Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          # Commit: ${{ github.sha }}
          # Workflow: ${{ github.run_id }}

          ## LazyVim Plugins
          $(ls -1 ~/.local/share/nvim/lazy/ | sed 's/^/  - /')

          ## Mason Packages
          $([ -d ~/.local/share/nvim/mason/packages ] && ls -1 ~/.local/share/nvim/mason/packages/ | sed 's/^/  - /' || echo "  (none)")

          ## Package Sizes
          LazyVim: $(du -sh ~/.local/share/nvim/lazy/ | cut -f1)
          Mason: $([ -d ~/.local/share/nvim/mason/packages ] && du -sh ~/.local/share/nvim/mason/packages/ | cut -f1 || echo "0")
          EOF

          cat packages/MANIFEST.txt

      - name: Upload LazyVim plugins
        uses: actions/upload-artifact@v4
        with:
          name: lazyvim-plugins-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/lazyvim-plugins-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 90

      - name: Upload Mason packages
        if: hashFiles('packages/mason-packages-${{ matrix.os }}-${{ matrix.arch }}.tar.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mason-packages-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/mason-packages-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 90

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: package-manifest-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/MANIFEST.txt
          retention-days: 90

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/lazyvim-plugins.tar.gz
            packages/mason-packages.tar.gz
            packages/MANIFEST.txt
          body: |
            # Neovim Packages for Air-Gap Deployment

            Built from `config/plugin-manifest.lua`

            ## Installation

            ```bash
            # Extract LazyVim plugins
            mkdir -p ~/.local/share/nvim
            tar -xzf lazyvim-plugins.tar.gz -C ~/.local/share/nvim/

            # Extract Mason packages
            tar -xzf mason-packages.tar.gz -C ~/.local/share/nvim/mason/

            # Copy config
            cp -r config/nvim/.config/nvim ~/.config/
            ```

            See MANIFEST.txt for list of included plugins.
