name: Version Checker

on:
  schedule:
    # Run weekly on Sunday at 02:00 UTC.
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  detect-updates:
    name: Detect tool updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.collect.outputs.has_updates }}
      updates: ${{ steps.collect.outputs.updates }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check upstream releases
        run: bash scripts/check-updates.sh --json-file updates.json --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Collect outdated tools
        id: collect
        run: |
          set -euo pipefail

          count=$(jq length updates.json)
          updates=$(jq -c . updates.json)

          echo "Found $count outdated tracked tool(s)."
          echo "updates=$updates" >> "$GITHUB_OUTPUT"

          if [[ "$count" -gt 0 ]]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

  open-update-prs:
    name: Open update PR for ${{ matrix.update.pretty }}
    runs-on: ubuntu-latest
    needs: detect-updates
    if: needs.detect-updates.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix:
        update: ${{ fromJSON(needs.detect-updates.outputs.updates) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply one tool version bump
        run: |
          bash scripts/check-updates.sh \
            --apply-tool "${{ matrix.update.tool }}" \
            --version "${{ matrix.update.latest }}"

          git diff -- Makefile

      - name: Validate Linux package with updated tool
        run: |
          set -euo pipefail

          make update
          make docker-test

      - name: Close superseded one-tool PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/close-superseded-update-prs.sh \
            --tool "${{ matrix.update.tool }}" \
            --keep-branch "auto-update/${{ matrix.update.tool }}"

      - name: Create one-tool update PR
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: Makefile
          branch: auto-update/${{ matrix.update.tool }}
          delete-branch: true
          commit-message: "chore: update ${{ matrix.update.pretty }} to ${{ matrix.update.latest }}"
          title: "chore: update ${{ matrix.update.pretty }} to ${{ matrix.update.latest }}"
          body: |
            ## Tool Update

            Updates `${{ matrix.update.pretty }}` from `${{ matrix.update.current }}` to `${{ matrix.update.latest }}`.

            Upstream release source: `${{ matrix.update.repo }}`

            Validation run before opening this PR:
            - `make update`
            - `make docker-test`

            This PR is intentionally scoped to one tool version bump.
          labels: |
            dependencies
            automated

      - name: Dispatch PR test workflow
        if: steps.create_pr.outputs.pull-request-operation != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pr-test.yml --ref "auto-update/${{ matrix.update.tool }}"
